  <style>
    /* ===== theme tokens (portfolio colours + Archivo) ===== */
    :root {
      --bwg-disp: 'Archivo', 'Poppins', system-ui, sans-serif;
      --bwg-sans: 'Archivo', system-ui, sans-serif;
      --ease: cubic-bezier(.87, 0, .13, 1);
      /* dark (default) */
      --bwg-bg: #0f0f0f;
      --bwg-ink: #f4f2ed;
      --bwg-sub: #9a9a98;
      --bwg-cell: #141414;
      --bwg-stroke: rgba(255, 255, 255, .10);
      --bwg-panel: #191919;
      --bwg-panel-bd: rgba(255, 255, 255, .14);
      --bwg-panel-ink: #d6d6d6;
      --bwg-chip-bg: #f0f0f0;
      --bwg-chip-ink: #17170f;
      --bwg-btn: rgba(255, 255, 255, .10);
      --bwg-btn-bd: rgba(255, 255, 255, .20);
      --bwg-btn-ink: #fff;
      --bwg-btn-hov: rgba(255, 255, 255, .22);
      --bwg-overlay: rgba(10, 10, 11, .82);
      --bwg-vig: linear-gradient(180deg, rgba(0, 0, 0, .55), transparent 20%, transparent 82%, rgba(0, 0, 0, .45));
      --bwg-chip-num: rgba(0, 0, 0, .42);
    }

    [data-theme="light"] {
      --bwg-bg: #faf9f7;
      --bwg-ink: #17170f;
      --bwg-sub: #6b6b66;
      --bwg-cell: #ffffff;
      --bwg-stroke: rgba(0, 0, 0, .12);
      --bwg-panel: #ffffff;
      --bwg-panel-bd: #e6e4df;
      --bwg-panel-ink: #3a3a36;
      --bwg-chip-bg: #17170f;
      --bwg-chip-ink: #faf9f7;
      --bwg-btn: rgba(0, 0, 0, .05);
      --bwg-btn-bd: rgba(0, 0, 0, .14);
      --bwg-btn-ink: #17170f;
      --bwg-btn-hov: rgba(0, 0, 0, .10);
      --bwg-overlay: rgba(250, 249, 247, .86);
      --bwg-vig: linear-gradient(180deg, rgba(0, 0, 0, .05), transparent 16%, transparent 86%, rgba(0, 0, 0, .04));
      --bwg-chip-num: rgba(255, 255, 255, .72);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box
    }

    html,
    body {
      height: 100%
    }

    body {
      background: var(--bwg-bg);
      font-family: var(--bwg-sans);
      color: var(--bwg-ink);
      overflow: hidden;
      cursor: grab;
      -webkit-user-select: none;
      user-select: none;
      transition: background .3s ease, color .3s ease
    }

    body.bwg-dragging {
      cursor: grabbing
    }

    body.bwg-zoom {
      cursor: default
    }

    img {
      -webkit-user-drag: none
    }

    /* portfolio nav floats above the fullscreen canvas */
    .mz-nav {
      position: fixed;
      top: 40px;
      left: 50%;
      transform: translateX(-50%) !important;
      z-index: 100;
      pointer-events: none
    }

    .mz-nav::before {
      display: none !important
    }

    /* remove the top background scrim shadow bar on fullscreen pages */
    .mz-nav>* {
      pointer-events: auto
    }

    /* empty nav strip must not eat clicks meant for the theme toggle */
    .mz-nav a {
      cursor: pointer
    }

    @media(max-width:760px) {
      #cw-launcher {
        bottom: 90px !important;
        right: 24px !important;
        left: auto !important;
        top: auto !important;
      }
    }

    /* hide header + theme toggle + chat while a card is expanded */
    body.bwg-zoom .site-header,
    body.bwg-zoom .mz-theme-btn,
    body.bwg-zoom #cw-launcher {
      opacity: 0 !important;
      pointer-events: none !important;
      transition: opacity .25s ease;
    }

    /* VIEWPORT / GRID: starts below the floating nav pill, flush with the bottom of the screen */
    .viewport {
      position: fixed;
      top: 128px;
      left: 0;
      right: 0;
      bottom: 0;
      overflow: hidden;
      z-index: 1;
      opacity: 0
    }
    @media(max-width: 768px) {
      .viewport {
        top: 72px;
      }
    }

    .canvas {
      position: absolute;
      top: 0;
      left: 0;
      transform-origin: 0 0;
      will-change: transform
    }

    .grid {
      position: relative;
      width: 100%;
      height: 100%
    }

    .cell {
      position: absolute;
      width: 1320px;
      height: 990px;
      background: var(--bwg-cell);
      cursor: pointer;
      overflow: hidden;
      will-change: transform, opacity;
      border-radius: 10px;
      opacity: 1;
      border: 1px solid var(--bwg-stroke);
      /* minimal stroke: keeps white images from bleeding into a light bg */
      transition: opacity .5s ease
    }

    /* Glassmorphic Skeleton Shimmer Loader */
    .cell::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.06) 50%, rgba(255,255,255,0) 100%);
      background-size: 200% 100%;
      animation: mz-shimmer 1.8s infinite linear;
      z-index: 1;
      pointer-events: none;
      transition: opacity 0.4s ease;
    }
    .cell.loaded::before {
      opacity: 0;
    }

    @keyframes mz-shimmer {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }

    .cell.dim {
      opacity: .12
    }

    .cell img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.4s ease;
    }
    .cell img.loaded {
      opacity: 1;
    }

    .cell::after {
      content: attr(data-n);
      position: absolute;
      left: 10px;
      top: 10px;
      font-family: var(--bwg-sans);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .04em;
      color: #fff;
      background: var(--bwg-chip-num);
      padding: 2px 7px;
      border-radius: 5px;
      opacity: 0;
      transition: opacity .3s
    }

    .cell:hover::after {
      opacity: 1
    }

    /* SPLIT / ZOOM */
    .split {
      position: fixed;
      inset: 0;
      display: flex;
      z-index: 99998;
      opacity: 0;
      pointer-events: none;
      background: var(--bwg-overlay);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      will-change: opacity;
    }

    .split.active {
      opacity: 1;
      pointer-events: auto
    }

    .split__l,
    .split__r {
      width: 50vw;
      height: 100vh;
      background: transparent;
      cursor: pointer
    }

    .zoom-target {
      display: none
    }

    .scaler {
      position: fixed;
      top: 0;
      left: 0;
      z-index: 99999;
      pointer-events: none;
      will-change: transform, opacity;
      transform: translateZ(0);
      overflow: hidden;
      border-radius: 12px;
      box-shadow: 0 0 0 1px var(--bwg-stroke), 0 30px 80px rgba(0, 0, 0, .5)
    }

    .scaler img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transform: translateZ(0);
    }

    /* Reset #main for fullscreen canvas */
    #main {
      max-width: none !important;
      margin: 0 !important;
      padding: 0 !important;
      border: none !important;
      position: static !important;
      width: 100% !important;
      height: 100% !important;
    }

    .detail {
      position: fixed !important;
      bottom: 48px !important;
      left: 48px !important;
      max-width: 420px;
      z-index: 100000;
      opacity: 0;
      pointer-events: none;
    }

    .detail .n {
      font-family: var(--bwg-sans);
      font-size: 12px;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: var(--bwg-sub);
      overflow: hidden;
    }

    .detail .n span,
    .detail h1 span, .detail h2 span,
    .detail .d span {
      display: block;
      will-change: transform;
    }

    .detail h1, .detail h2 {
      font-family: var(--bwg-disp);
      font-size: 44px;
      font-weight: 600;
      letter-spacing: -.02em;
      line-height: 1.15;
      margin: 10px 0 14px;
      overflow: hidden;
      color: var(--bwg-ink);
    }

    .detail .d {
      color: var(--bwg-sub);
      font-size: 16px;
      font-weight: 400;
      line-height: 1.55;
      overflow: hidden;
    }

    @media(max-width:900px) {
      .detail {
        left: 20px !important;
        bottom: 24px !important;
        max-width: calc(100vw - 40px);
      }

      .detail h1, .detail h2 {
        font-size: 24px;
        margin: 6px 0 8px;
      }
      .detail .d {
        font-size: 13.5px;
      }
      .navbtn {
        width: 42px;
        height: 42px;

      .navbtn.left { left: 10px; }
      .navbtn.right { right: 10px; }
      .close {
        top: 16px;
        right: 16px;
        width: 40px;
        height: 40px;
      }
    }
    @media(max-width:480px) {
      .detail {
        left: 16px !important;
        bottom: 20px !important;
        max-width: calc(100vw - 32px);
      }
      .detail h1, .detail h2 {
        font-size: 20px;
        margin: 4px 0 6px;
      }
      .detail .d {
        font-size: 12.5px;
        line-height: 1.45;
      }
      .navbtn {
        width: 36px;
        height: 36px;
      }
      .navbtn svg {
        width: 18px;
        height: 18px;
      }
      .navbtn.left { left: 8px; }
      .navbtn.right { right: 8px; }
    }

    .close {
      position: fixed;
      top: 24px;
      right: 24px;
      width: 48px;
      height: 48px;
      transform: translateX(40px);
      background: var(--bwg-btn);
      border: 1px solid var(--bwg-btn-bd);
      border-radius: 50%;
      cursor: pointer;
      opacity: 0;
      pointer-events: none;
      color: var(--bwg-btn-ink);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background .2s, transform .2s, border-color .2s;
      z-index: 100002 !important;
    }

    .close.active {
      pointer-events: auto
    }

    .close:hover {
      background: var(--bwg-btn-hov);
      transform: scale(1.05);
    }

    .close svg {
      width: 20px;
      height: 20px;
      stroke: currentColor
    }

    /* prev / next arrows in the lightbox */
    .navbtn {
      position: fixed;
      top: 50%;
      transform: translateY(-50%);
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: var(--bwg-btn);
      border: 1px solid var(--bwg-btn-bd);
      color: var(--bwg-btn-ink);
      cursor: pointer;
      z-index: 100002 !important;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: background .2s, transform .2s, opacity .25s, border-color .2s;
    }

    .navbtn.active {
      pointer-events: auto
    }

    .navbtn:hover {
      background: var(--bwg-btn-hov);
      transform: translateY(-50%) scale(1.06);
    }

    .navbtn svg {
      width: 22px;
      height: 22px
    }

    .navbtn.left {
      left: 26px
    }

    .navbtn.right {
      right: 26px
    }

  
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border-width: 0;
    }
    .bw-nojs {
      max-width: 1240px;
      margin: 120px auto 60px;
      padding: 0 24px;
    }
    .bw-nojs__grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 24px;
      margin-top: 28px;

    .bw-nojs__card {
      background: var(--bwg-cell, #181818);
      border: 1px solid var(--bwg-stroke, rgba(255,255,255,0.08));
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s, border-color 0.2s;
    }
    .bw-nojs__card:hover {
      border-color: rgba(255,255,255,0.2);
      transform: translateY(-2px);
    }
    .bw-nojs__card img {
      width: 100%;

      object-fit: cover;
      display: block;
    }
    .bw-nojs__info {
      padding: 16px 18px;

    .bw-nojs__num {

    .bw-nojs__title {

    .bw-nojs__desc {
      font-size: 13.5px;
      color: var(--bwg-sub, #a0a098);
      line-height: 1.5;
      margin: 0;
    }

  </style>
</head>

      reflow() {
        if (this.zoomOn) return;
        const prevCols = this.cfg.cols;
        this.updateConfig();
        if (prevCols !== this.cfg.cols) {
          this.grid.innerHTML = '';
          this.items = [];
          this.buildGrid();
          const z = this.cfg.zoom;
          gsap.set(this.canvas, { scale: z });
          const c = this.center(z);
          gsap.set(this.canvas, { x: c.x, y: c.y });
          this.initDrag();
          this.observe();
        } else {
          this.dims(this.cfg.gap);
          const z = this.cfg.zoom;
          gsap.set(this.canvas, { scale: z });
          this.initDrag();
        }
      }
    }

    let gallery;
    function boot() {
      if (window._booted) return;
      window._booted = true;
      gallery = new Gallery();
      gallery.intro();
      addEventListener('resize', () => {
        clearTimeout(gallery._rz);
        gallery._rz = setTimeout(() => {
          if (gallery) gallery.reflow();
        }, 150);
      });
    }
    if (document.readyState === 'interactive' || document.readyState === 'complete') {
      boot();
    } else {
      document.addEventListener('DOMContentLoaded', boot);
      addEventListener('load', boot);
    }
  </script>
