      --bwg-panel-bd: rgba(255, 255, 255, .14);

      --bwg-btn: rgba(255, 255, 255, .10);
      --bwg-btn-bd: rgba(255, 255, 255, .20);
      --bwg-btn-ink: #fff;
      --bwg-btn-hov: rgba(255, 255, 255, .22);
      --bwg-overlay: rgba(10, 10, 11, .82);
      --bwg-vig: linear-gradient(180deg, rgba(0, 0, 0, .55), transparent 20%, transparent 82%, rgba(0, 0, 0, .45));

    }

    [data-theme="light"] {
      --bwg-bg: #faf9f7;
      --bwg-ink: #17170f;
      --bwg-sub: #6b6b66;
      --bwg-cell: #ffffff;
      --bwg-stroke: rgba(0, 0, 0, .12);
      --bwg-panel: #ffffff;
      --bwg-panel-bd: #e6e4df;
      --bwg-panel-ink: #3a3a36;
      --bwg-chip-bg: #17170f;
      --bwg-chip-ink: #faf9f7;
      --bwg-btn: rgba(0, 0, 0, .05);
      --bwg-btn-bd: rgba(0, 0, 0, .14);
      --bwg-btn-ink: #17170f;
      --bwg-btn-hov: rgba(0, 0, 0, .10);
      --bwg-overlay: rgba(250, 249, 247, .86);
      --bwg-vig: linear-gradient(180deg, rgba(0, 0, 0, .05), transparent 16%, transparent 86%, rgba(0, 0, 0, .04));
      --bwg-chip-num: rgba(255, 255, 255, .72);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box
    }

    html,
    body {
      height: 100%
    }

    body {
      background: var(--bwg-bg);
      font-family: var(--bwg-sans);
      color: var(--bwg-ink);
      overflow: hidden;
      cursor: grab;
      -webkit-user-select: none;
      user-select: none;
      transition: background .3s ease, color .3s ease
    }

    body.bwg-dragging {
      cursor: grabbing
    }

    body.bwg-zoom {
      cursor: default
    }

    img {
      -webkit-user-drag: none
    }

    /* portfolio nav floats above the fullscreen canvas */
    .mz-nav {
      position: fixed;
      top: 40px;
      left: 50%;
      transform: translateX(-50%) !important;
      z-index: 100;
      pointer-events: none
    }

    .mz-nav::before {
      display: none !important
    }

    /* remove the top background scrim shadow bar on fullscreen pages */
    .mz-nav>* {
      pointer-events: auto
    }

    /* empty nav strip must not eat clicks meant for the theme toggle */
    .mz-nav a {
      cursor: pointer
    }

    /* theme toggle: force clear contrast on the fullscreen canvas (both themes) */
    .mz-theme-btn {
      background: var(--bwg-panel) !important;
      border: 1px solid var(--bwg-panel-bd) !important;
      color: var(--bwg-ink) !important;
      box-shadow: 0 8px 24px rgba(0, 0, 0, .28) !important;
      z-index: 120 !important
    }

    @media(min-width:761px) {
      .mz-theme-btn {
        top: 44px !important;
        right: 40px !important
      }
    }

    /* desktop: vertically centered with the nav row */
    @media(max-width:760px) {
      .mz-theme-btn {
        bottom: 90px !important;
        left: 24px !important;
        right: auto !important;
        top: auto !important;
      }

      #cw-launcher {
        bottom: 90px !important;
        right: 24px !important;
        left: auto !important;
        top: auto !important;
      }
    }

    .mz-theme-btn:hover {
      background: var(--bwg-btn-hov) !important
    }

    /* hide the zoom controls + footer + theme toggle + chat while a card is expanded — not needed there */
    body.bwg-zoom .controls,
    body.bwg-zoom .mz-theme-btn,
    body.bwg-zoom #cw-launcher {
      opacity: 0 !important;
      pointer-events: none !important;
    }

    /* VIEWPORT / GRID */
    .viewport {
      position: fixed;
      inset: 0;
      overflow: hidden;
      z-index: 1;
      opacity: 0
    }

    .canvas {
      position: absolute;
      top: 0;
      left: 0;
      transform-origin: 0 0;
      will-change: transform
    }

    .grid {
      position: relative;
      width: 100%;
      height: 100%
    }

    .cell {
      position: absolute;
      width: 1024px;
      height: 768px;
      background: var(--bwg-cell);
      cursor: pointer;
      overflow: hidden;
      will-change: transform, opacity;
      border-radius: 10px;
      opacity: 1;
      border: 1px solid var(--bwg-stroke);
      /* minimal stroke — keeps white images from bleeding into a light bg */
      transition: opacity .5s ease
    }

    /* Glassmorphic Skeleton Shimmer Loader */
    .cell::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.06) 50%, rgba(255,255,255,0) 100%);
      background-size: 200% 100%;
      animation: mz-shimmer 1.8s infinite linear;
      z-index: 1;
      pointer-events: none;
      transition: opacity 0.4s ease;
    }
    .cell.loaded::before {
      opacity: 0;
    }

    @keyframes mz-shimmer {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }

    .cell.dim {
      opacity: .12
    }

    .cell img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.4s ease;
    }
    .cell img.loaded {
      opacity: 1;
    }

    .cell::after {
      content: attr(data-n);
      position: absolute;
      left: 10px;
      top: 10px;
      font-family: var(--bwg-sans);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .04em;
      color: #fff;
      background: var(--bwg-chip-num);
      padding: 2px 7px;
      border-radius: 5px;
      opacity: 0;
      transition: opacity .3s
    }

    .cell:hover::after {
      opacity: 1
    }

      display: flex;
      z-index: 2;
      opacity: 0;
      pointer-events: none;
      background: var(--bwg-overlay);
      backdrop-filter: blur(3px)

    class Gallery {
      constructor() {
        this.vp = document.getElementById('viewport');
        this.canvas = document.getElementById('canvas');
        this.grid = document.getElementById('grid');
        this.split = document.getElementById('split');
        this.detail = document.getElementById('detail');
        this.close = document.getElementById('close');
        this.close.addEventListener('click', () => this.exit());
        this.prevBtn = document.getElementById('prevBtn');
        this.nextBtn = document.getElementById('nextBtn');
        this.prevBtn.addEventListener('click', () => this.navigate(-1));
        this.nextBtn.addEventListener('click', () => this.navigate(1));
        this.controls = document.getElementById('controls');
        this.ease = CustomEase.create("smooth", ".87,0,.13,1");
        const initialGap = 32;
        const totalW = 8 * (1024 + initialGap) - initialGap, totalH = 6 * (768 + initialGap) - initialGap;
        const defaultFitZoom = Math.round(Math.max(.1, Math.min(1.4, Math.min((innerWidth - 80) / totalW, (innerHeight - 140) / totalH))) * 100) / 100;
        this.cfg = { width: 1024, height: 768, rows: 6, cols: 8, zoom: defaultFitZoom, gap: initialGap };
        this.items = []; this.zoomOn = false; this.sel = null; this.overlay = null; this.drag = null;
        this.buildGrid();
        this.slider = document.getElementById('zoomSlider');
        if (this.slider) {
          this.slider.addEventListener('input', (e) => this.sliderZoom(parseFloat(e.target.value) / 100));
        }
        const pctLabel = document.getElementById('pct');
        if (pctLabel) {
          pctLabel.addEventListener('click', () => {
            const current = this.cfg.zoom;
            let next = 0.6;
            if (current < 0.45) next = 0.6;
            else if (current < 0.75) next = 1.0;
            else if (current < 1.2) next = 1.4;
            else next = 0.3;
            this.sliderZoom(next);
          });
        }
      }
      gapFor(z) { return z >= 1 ? 16 : z >= 0.6 ? 32 : 64; }
      buildGrid() {
        this.cfg.gap = this.gapFor(this.cfg.zoom); this.dims(this.cfg.gap);
        this.canvas.style.width = this.gw + 'px'; this.canvas.style.height = this.gh + 'px';
        let k = 0;
        for (let r = 0; r < this.cfg.rows; r++) for (let c = 0; c < this.cfg.cols; c++) {
          const x = c * (this.cfg.width + this.cfg.gap), y = r * (this.cfg.height + this.cfg.gap);
          const el = document.createElement('div'); el.className = 'cell'; el.style.left = x + 'px'; el.style.top = y + 'px'; el.style.opacity = 0;
          el.dataset.n = String((k % META.length) + 1).padStart(2, '0');
          const img = document.createElement('img');
          img.src = IMAGES[k % IMAGES.length].replace('.webp', '_thumb.webp') + '?v=hd';
          img.loading = 'lazy';
          img.alt = '';

          const markLoaded = () => {
            img.classList.add('loaded');
            el.classList.add('loaded');
          };
          if (img.complete) {
            markLoaded();
          } else {
            img.onload = markLoaded;
            img.onerror = markLoaded;
          }

          const itemIndex = k;
          el.addEventListener('mouseenter', () => {
            if (IMAGES[itemIndex]) {
              const hd = new Image();
              hd.src = IMAGES[itemIndex] + '?v=hd';
            }
          });

          el.appendChild(img);
          const data = { el, img, r, c, x, y, index: k };
          el.addEventListener('click', () => { if (!this.zoomOn) this.enter(data); });
          this.grid.appendChild(el); this.items.push(data); k++;
        }
      }
      center(z) {
        const vw = innerWidth, vh = innerHeight; this.dims(this.cfg.gap);
        return { x: (vw - this.gw * z) / 2, y: (vh - this.gh * z) / 2 };
      }
      initDrag() {
        if (this.drag) this.drag.kill();
        const z = this.cfg.zoom, vw = innerWidth, vh = innerHeight, m = this.cfg.gap * z;
        this.dims(this.cfg.gap); const sw = this.gw * z, sh = this.gh * z;
        let minX, maxX, minY, maxY;
        if (sw <= vw) { minX = maxX = (vw - sw) / 2 } else { maxX = m; minX = vw - sw - m }
        if (sh <= vh) { minY = maxY = (vh - sh) / 2 } else { maxY = m; minY = vh - sh - m }
        this.drag = Draggable.create(this.canvas, {
          type: "x,y", bounds: { minX, maxX, minY, maxY }, edgeResistance: .85, dragResistance: .06,
          force3D: true,
          onDragStart: () => {
            document.body.classList.add('bwg-dragging');
            this.canvas.style.willChange = 'transform';
          },
          onDragEnd: () => {
            document.body.classList.remove('bwg-dragging');
            this.canvas.style.willChange = 'auto';
          }
        })[0];
      }

      intro() {
        const z = this.cfg.zoom; gsap.set(this.canvas, { scale: z });
        const c = this.center(z); gsap.set(this.canvas, { x: c.x, y: c.y });
        const vw = innerWidth, vh = innerHeight;
        const cx = (vw / 2 - c.x) / z - this.cfg.width / 2, cy = (vh / 2 - c.y) / z - this.cfg.height / 2;
        this.items.forEach((it, i) => gsap.set(it.el, { left: cx, top: cy, scale: .8, opacity: 0, zIndex: this.items.length - i }));
        gsap.to(this.vp, { opacity: 1, duration: .5 });
        gsap.to(this.items.map(i => i.el), {
          duration: .5, left: i => this.items[i].x, top: i => this.items[i].y, scale: 1, opacity: 1, ease: "power2.out",
          stagger: { amount: 1.4, grid: [this.cfg.rows, this.cfg.cols], from: "center" },
          onComplete: () => {
            this.items.forEach(it => gsap.set(it.el, { zIndex: 1 })); this.initDrag(); this.observe();
            gsap.to(this.controls, { opacity: 1, duration: .5 });
          }
        });
        this.pct(z);
      }
      observe() {
        this.io = new IntersectionObserver((es) => es.forEach(e => {
          if (this.sel && e.target === this.sel.el) return;
          e.target.classList.toggle('dim', !e.isIntersecting);
        }), { threshold: .1, rootMargin: '8%' });
        this.items.forEach(it => this.io.observe(it.el));
      }
      pct(z) {
        document.getElementById('pct').textContent = Math.round(z * 100) + '%';
        const slider = document.getElementById('zoomSlider');
        if (slider) slider.value = Math.round(z * 100);
      }
      setZoom(z, btn) {
        if (this.zoomOn) { this.exit(); return; }
        const gap = this.gapFor(z); this.cfg.zoom = z;
        if (gap !== this.cfg.gap) {
          this.cfg.gap = gap;
          this.items.forEach(it => {
            it.x = it.c * (this.cfg.width + gap); it.y = it.r * (this.cfg.height + gap);
            gsap.to(it.el, { left: it.x, top: it.y, duration: .9, ease: this.ease });
          });
          this.dims(gap); gsap.to(this.canvas, { width: this.gw, height: this.gh, duration: .9, ease: this.ease });
        }
        const c = this.center(z);
        gsap.to(this.canvas, { scale: z, x: c.x, y: c.y, duration: 1, ease: this.ease, onComplete: () => this.initDrag() });
        this.pct(z);
        document.querySelectorAll('.switch button').forEach(b => b.classList.remove('cur')); if (btn) btn.classList.add('cur');
      }
      sliderZoom(z) {
        if (this.zoomOn) { this.exit(); return; }
        const gap = this.gapFor(z); this.cfg.zoom = z;
        if (gap !== this.cfg.gap) {
          this.cfg.gap = gap;
          this.items.forEach(it => {
            it.x = it.c * (this.cfg.width + gap); it.y = it.r * (this.cfg.height + gap);
            gsap.set(it.el, { left: it.x, top: it.y });
          });
          this.dims(gap); gsap.set(this.canvas, { width: this.gw, height: this.gh });
        }
        const c = this.center(z);
        gsap.to(this.canvas, { scale: z, x: c.x, y: c.y, duration: 0.2, ease: "power2.out", onComplete: () => this.initDrag() });
        document.getElementById('pct').textContent = Math.round(z * 100) + '%';
        document.querySelectorAll('.switch button').forEach(b => b.classList.remove('cur'));
      }
      fit(btn) {
        if (this.zoomOn) { this.exit(); return; }
        const gap = this.gapFor(1), w = this.cfg.cols * (this.cfg.width + gap) - gap, h = this.cfg.rows * (this.cfg.height + gap) - gap;
        const z = Math.max(.1, Math.min(1.4, Math.min((innerWidth - 80) / w, (innerHeight - 140) / h)));
        this.setZoom(Math.round(z * 100) / 100, btn);
      }
      preloadAdjacent(i) {
        const total = this.items.length;
        const nextIdx = (i + 1) % total;
        const prevIdx = (i - 1 + total) % total;
        [nextIdx, prevIdx].forEach(idx => {
          if (IMAGES[idx]) {
            const img = new Image();
            img.src = IMAGES[idx] + '?v=hq';
          }
        });
      }
      enter(data) {
        this.zoomOn = true; this.sel = data; document.body.classList.add('bwg-zoom'); if (this.drag) this.drag.disable();
        const r = data.img.getBoundingClientRect();
        const ov = document.createElement('div'); ov.className = 'scaler';
        const im = document.createElement('img'); im.src = IMAGES[data.index] + '?v=hq'; ov.appendChild(im);
        document.body.appendChild(ov); this.overlay = ov;
        gsap.set(ov, { left: r.left, top: r.top, width: r.width, height: r.height, opacity: 1 });
        gsap.set(data.img, { opacity: 0 });
        this.split.classList.add('active'); gsap.to(this.split, { opacity: 1, duration: .6, ease: this.ease });
        
        const isMobile = innerWidth < 768;
        const maxW = isMobile ? innerWidth * 0.9 : innerWidth * 0.6;
        const maxH = isMobile ? innerHeight * 0.45 : innerHeight * 0.74;
        let W = maxW;
        let H = W * (768 / 1024);
        if (H > maxH) {
          H = maxH;
          W = H * (1024 / 768);
        }
        const topPos = isMobile ? innerHeight * 0.12 : (innerHeight - H) / 2;
        gsap.to(ov, {
          left: (innerWidth - W) / 2, top: topPos, width: W, height: H,
          duration: .9, ease: this.ease, onComplete: () => {
            this.showDetail(data.index);
            this.preloadAdjacent(data.index);
          }
        });
        this.close.classList.add('active');
        gsap.fromTo(this.close, { x: 40, opacity: 0 }, { x: 0, opacity: 1, duration: .6, delay: .5, ease: "power2.out" });
        this.prevBtn.classList.add('active'); this.nextBtn.classList.add('active');
        gsap.to([this.prevBtn, this.nextBtn], { opacity: 1, duration: .4, delay: .5 });
        document.getElementById('splitL').addEventListener('click', this._areaClick = (e) => { if (e.target === e.currentTarget) this.exit(); });
        document.getElementById('splitR').addEventListener('click', this._areaClick);
        document.addEventListener('keydown', this._key = (e) => {
          if (e.key === 'Escape') this.exit();
          else if (e.key === 'ArrowLeft') this.navigate(-1);
          else if (e.key === 'ArrowRight') this.navigate(1);
        });

        // Mouse Wheel & Trackpad Navigation Listener
        let lastWheelTime = 0;
        window.addEventListener('wheel', this._wheel = (e) => {
          if (!this.zoomOn) return;
          e.preventDefault();
          const now = Date.now();
          if (now - lastWheelTime < 220) return;
          if (Math.abs(e.deltaY) > 10 || Math.abs(e.deltaX) > 10) {
            lastWheelTime = now;
            const dir = (e.deltaY > 0 || e.deltaX > 0) ? 1 : -1;
            this.navigate(dir);
          }
        }, { passive: false });

        // Touch Swipe Gestures for Mobile
        let touchStartX = 0, touchStartY = 0;
        window.addEventListener('touchstart', this._touchStart = (e) => {
          if (!this.zoomOn || e.touches.length > 1) return;
          touchStartX = e.touches[0].clientX;
          touchStartY = e.touches[0].clientY;
        }, { passive: true });

        window.addEventListener('touchend', this._touchEnd = (e) => {
          if (!this.zoomOn || e.changedTouches.length === 0) return;
          const dx = e.changedTouches[0].clientX - touchStartX;
          const dy = e.changedTouches[0].clientY - touchStartY;
          if (Math.abs(dx) > 36 && Math.abs(dx) > Math.abs(dy)) {
            this.navigate(dx < 0 ? 1 : -1);
          }
        }, { passive: true });
      }
      navigate(dir) {
        if (!this.zoomOn || !this.overlay || this.isNavigating) return;
        this.isNavigating = true;
        const total = this.items.length;
        gsap.set(this.sel.img, { opacity: 1 });                       // restore the cell we're leaving
        this.sel = this.items[(this.sel.index + dir + total) % total];
        gsap.set(this.sel.img, { opacity: 0 });                       // hide the new cell (overlay stands in)
        
        const im = this.overlay.querySelector('img');
        const slideOutX = dir > 0 ? -60 : 60;
        const slideInX = dir > 0 ? 60 : -60;

        gsap.to(this.overlay, {
          x: slideOutX, opacity: 0, duration: 0.18, ease: "power2.in", onComplete: () => {
            im.src = IMAGES[this.sel.index] + '?v=hq';
            this.preloadAdjacent(this.sel.index);
            gsap.set(this.overlay, { x: slideInX });
            gsap.to(this.overlay, {
              x: 0, opacity: 1, duration: 0.3, ease: this.ease, onComplete: () => {
                this.isNavigating = false;
              }
            });
            this.showDetail(this.sel.index);
          }
        });
      }
      showDetail(i) {
        const m = META[i % META.length];
        document.getElementById('dN').textContent = m.n; document.getElementById('dT').textContent = m.t; document.getElementById('dD').textContent = m.d;
        gsap.set('#dN', { y: 20, opacity: 0 }); gsap.set('#dT', { y: 60, opacity: 0 }); gsap.set('#dD', { y: 80, opacity: 0 });
        this.detail.style.pointerEvents = 'none'; gsap.to(this.detail, { opacity: 1, duration: .3 });
        gsap.to('#dN', { y: 0, opacity: 1, duration: .8, delay: .1, ease: this.ease });
        gsap.to('#dT', { y: 0, opacity: 1, duration: .8, delay: .15, ease: this.ease });
        gsap.to('#dD', { y: 0, opacity: 1, duration: .8, delay: .2, ease: this.ease });
      }
      exit() {
        if (!this.zoomOn || !this.sel || !this.overlay) return;

        document.removeEventListener('keydown', this._key);

        if (this._touchStart) window.removeEventListener('touchstart', this._touchStart);
        if (this._touchEnd) window.removeEventListener('touchend', this._touchEnd);
        document.getElementById('splitL').removeEventListener('click', this._areaClick);
        document.getElementById('splitR').removeEventListener('click', this._areaClick);
        gsap.to(this.detail, { opacity: 0, duration: .3 });
        gsap.to(['#dN', '#dT', '#dD'], { y: -40, opacity: 0, duration: .35, ease: "power2.out" });
        gsap.to(this.close, { opacity: 0, x: 40, duration: .3 });
        gsap.to([this.prevBtn, this.nextBtn], { opacity: 0, duration: .3 });
        this.prevBtn.classList.remove('active'); this.nextBtn.classList.remove('active');
        this.split.classList.remove('active'); gsap.to(this.split, { opacity: 0, duration: .6 });

          }

      }

    let gallery;
    function boot() {
      if (window._booted) return;

      gallery = new Gallery();
      gallery.intro();
      const pre = document.getElementById('pre');
      if (pre) {
        pre.style.opacity = 0;
