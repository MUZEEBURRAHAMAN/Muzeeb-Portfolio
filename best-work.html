      --bwg-btn-hov: rgba(255, 255, 255, .22);
      --bwg-overlay: rgba(10, 10, 11, .82);
      --bwg-vig: linear-gradient(180deg, rgba(0, 0, 0, .55), transparent 20%, transparent 82%, rgba(0, 0, 0, .45));
      --bwg-chip-num: rgba(0, 0, 0, .42);
    }

    [data-theme="light"] {
      --bwg-bg: #faf9f7;
      --bwg-ink: #17170f;
      --bwg-sub: #6b6b66;
      --bwg-cell: #ffffff;
      --bwg-stroke: rgba(0, 0, 0, .12);
      --bwg-panel: #ffffff;
      --bwg-panel-bd: #e6e4df;
      --bwg-panel-ink: #3a3a36;
      --bwg-chip-bg: #17170f;
      --bwg-chip-ink: #faf9f7;
      --bwg-btn: rgba(0, 0, 0, .05);
      --bwg-btn-bd: rgba(0, 0, 0, .14);
      --bwg-btn-ink: #17170f;
      --bwg-btn-hov: rgba(0, 0, 0, .10);
      --bwg-overlay: rgba(250, 249, 247, .86);
      --bwg-vig: linear-gradient(180deg, rgba(0, 0, 0, .05), transparent 16%, transparent 86%, rgba(0, 0, 0, .04));
      --bwg-chip-num: rgba(255, 255, 255, .72);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box
    }

    html,
    body {
      height: 100%
    }

    body {
      background: var(--bwg-bg);
      font-family: var(--bwg-sans);
      color: var(--bwg-ink);
      overflow: hidden;
      cursor: grab;
      -webkit-user-select: none;
      user-select: none;
      transition: background .3s ease, color .3s ease
    }

    body.bwg-dragging {
      cursor: grabbing
    }

    body.bwg-zoom {
      cursor: default
    }

    img {
      -webkit-user-drag: none
    }

    /* portfolio nav floats above the fullscreen canvas */
    .mz-nav {
      position: fixed;
      top: 40px;
      left: 50%;
      transform: translateX(-50%) !important;
      z-index: 100;
      pointer-events: none
    }

    .mz-nav::before {
      display: none !important
    }

    /* remove the top background scrim shadow bar on fullscreen pages */
    .mz-nav>* {
      pointer-events: auto
    }

    /* empty nav strip must not eat clicks meant for the theme toggle */
    .mz-nav a {
      cursor: pointer
    }

    @media(max-width:760px) {
      #cw-launcher {
        bottom: 90px !important;
        right: 24px !important;
        left: auto !important;
        top: auto !important;
      }
    }

    /* hide header + theme toggle + chat while a card is expanded */
    body.bwg-zoom .site-header,
    body.bwg-zoom .mz-theme-btn,
    body.bwg-zoom #cw-launcher {
      opacity: 0 !important;
      pointer-events: none !important;
      transition: opacity .25s ease;
    }

    /* VIEWPORT / GRID — starts below the floating nav pill, flush with the bottom of the screen */
    .viewport {
      position: fixed;
      top: 128px;
      left: 0;
      right: 0;
      bottom: 0;
      overflow: hidden;
      z-index: 1;
      opacity: 0
    }

    .canvas {
      position: absolute;
      top: 0;
      left: 0;
      transform-origin: 0 0;
      will-change: transform
    }

    .grid {
      position: relative;
      width: 100%;
      height: 100%
    }

    .cell {
      position: absolute;
      width: 1320px;
      height: 990px;
      background: var(--bwg-cell);
      cursor: pointer;
      overflow: hidden;
      will-change: transform, opacity;
      border-radius: 10px;
      opacity: 1;
      border: 1px solid var(--bwg-stroke);
      /* minimal stroke — keeps white images from bleeding into a light bg */
      transition: opacity .5s ease
    }

    /* Glassmorphic Skeleton Shimmer Loader */
    .cell::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.06) 50%, rgba(255,255,255,0) 100%);
      background-size: 200% 100%;
      animation: mz-shimmer 1.8s infinite linear;
      z-index: 1;
      pointer-events: none;
      transition: opacity 0.4s ease;
    }
    .cell.loaded::before {
      opacity: 0;
    }

    @keyframes mz-shimmer {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }

    .cell.dim {
      opacity: .12
    }

    .cell img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.4s ease;
    }
    .cell img.loaded {
      opacity: 1;
    }

    .cell::after {
      content: attr(data-n);
      position: absolute;
      left: 10px;
      top: 10px;
      font-family: var(--bwg-sans);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .04em;
      color: #fff;
      background: var(--bwg-chip-num);
      padding: 2px 7px;
      border-radius: 5px;
      opacity: 0;
      transition: opacity .3s
    }

    .cell:hover::after {
      opacity: 1
    }

    /* SPLIT / ZOOM */
    .split {
      position: fixed;
      inset: 0;
      display: flex;
      z-index: 99998;
      opacity: 0;
      pointer-events: none;
      background: var(--bwg-overlay);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      will-change: opacity;
    }

    .split.active {
      opacity: 1;
      pointer-events: auto
    }

    .split__l,
    .split__r {
      width: 50vw;
      height: 100vh;
      background: transparent;
      cursor: pointer
    }

    .zoom-target {
      display: none
    }

    .scaler {
      position: fixed;
      top: 0;
      left: 0;
      z-index: 99999;
      pointer-events: none;
      will-change: transform, opacity;
      transform: translateZ(0);
      overflow: hidden;
      border-radius: 12px;
      box-shadow: 0 0 0 1px var(--bwg-stroke), 0 30px 80px rgba(0, 0, 0, .5)
    }

    .scaler img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transform: translateZ(0);
    }

    .detail {
      position: absolute;
      bottom: 48px;
      left: 48px;
      max-width: 420px;
      z-index: 100000;
      opacity: 0;
      pointer-events: none
    }

    .detail .n {
      font-family: var(--bwg-sans);
      font-size: 12px;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: var(--bwg-sub);
      overflow: hidden
    }

    .detail .n span,

    .detail h1 {

      color: var(--bwg-ink)

    .detail .d {

      line-height: 1.55;

    .close {

      top: 24px;
      right: 24px;
      width: 48px;
      height: 48px;

        this.grid = document.getElementById('grid');
        this.split = document.getElementById('split');
        this.detail = document.getElementById('detail');
        this.close = document.getElementById('close');
        this.close.addEventListener('click', () => this.exit());
        this.prevBtn = document.getElementById('prevBtn');
        this.nextBtn = document.getElementById('nextBtn');
        this.prevBtn.addEventListener('click', () => this.navigate(-1));
        this.nextBtn.addEventListener('click', () => this.navigate(1));
        this.ease = CustomEase.create("smooth", ".16,1,.3,1");
        // Fixed zoom (no controls to change it) — matches the "32%" view this was tuned against.
        this.cfg = { width: 1320, height: 990, rows: 12, cols: 4, zoom: 0.32, gap: 32 };
        this.items = []; this.zoomOn = false; this.sel = null; this.overlay = null; this.drag = null;
        this._isElasticSettled = true;
        this.buildGrid();
        this.vp.addEventListener('wheel', (e) => this.onGridWheel(e), { passive: false });
      }
      // Mouse-wheel / trackpad panning of the grid — scrolls through the canvas like a normal
      // page scroll, feeding the elastic stretch effect below via pan velocity.
      onGridWheel(e) {
        if (this.zoomOn || !this.drag || this.drag.isDragging || !this.bounds) return;
        e.preventDefault();
        const b = this.bounds, now = performance.now();
        if (!this._wt || now - (this._wtT || 0) > 200) {
          this._wt = { x: gsap.getProperty(this.canvas, 'x'), y: gsap.getProperty(this.canvas, 'y') };
        }
        this._wtT = now;
        this._wt.x = gsap.utils.clamp(b.minX, b.maxX, this._wt.x - e.deltaX);
        this._wt.y = gsap.utils.clamp(b.minY, b.maxY, this._wt.y - e.deltaY);
        gsap.to(this.canvas, { x: this._wt.x, y: this._wt.y, duration: .45, ease: 'power3.out', overwrite: 'auto' });
      }
      gapFor(z) { return z >= 1 ? 16 : z >= 0.6 ? 32 : 64; }
      dims(gap) {
        const w = this.cfg.cols * (this.cfg.width + gap) - gap, h = this.cfg.rows * (this.cfg.height + gap) - gap;
        this.gw = w; this.gh = h; return { w, h };
      }
      buildGrid() {
        this.cfg.gap = this.gapFor(this.cfg.zoom); this.dims(this.cfg.gap);
        this.canvas.style.width = this.gw + 'px'; this.canvas.style.height = this.gh + 'px';
        let k = 0;
        for (let r = 0; r < this.cfg.rows; r++) for (let c = 0; c < this.cfg.cols; c++) {
          const x = c * (this.cfg.width + this.cfg.gap), y = r * (this.cfg.height + this.cfg.gap);
          const el = document.createElement('div'); el.className = 'cell'; el.style.left = x + 'px'; el.style.top = y + 'px'; el.style.opacity = 0;
          el.dataset.n = String((k % META.length) + 1).padStart(2, '0');
          const img = document.createElement('img');
          img.decoding = 'async';
          img.loading = 'lazy';
          img.alt = (META[k % META.length] && META[k % META.length].t) ? META[k % META.length].t : '';
          img.src = IMAGES[k % IMAGES.length].replace('.webp', '_thumb.webp');

          const markLoaded = () => {
            img.classList.add('loaded');
            el.classList.add('loaded');
          };
          if (img.complete && img.naturalWidth > 0) {
            markLoaded();
          } else {
            img.onload = markLoaded;
            img.onerror = markLoaded;
          }

          el.appendChild(img);
          const data = { el, img, r, c, x, y, index: k };
          el.addEventListener('click', (e) => {
            if (this.drag && this.drag.isDragging) return;
            if (!this.zoomOn) this.enter(data);
          });
          this.grid.appendChild(el); this.items.push(data); k++;
        }
      }
      center(z) {
        const vw = this.vp.clientWidth, vh = this.vp.clientHeight; this.dims(this.cfg.gap);
        return { x: (vw - this.gw * z) / 2, y: (vh - this.gh * z) / 2 };
      }
      initDrag() {
        if (this.drag) this.drag.kill();
        const z = this.cfg.zoom, vw = this.vp.clientWidth, vh = this.vp.clientHeight, m = this.cfg.gap * z;
        this.dims(this.cfg.gap); const sw = this.gw * z, sh = this.gh * z;
        let minX, maxX, minY, maxY;
        if (sw <= vw) { minX = maxX = (vw - sw) / 2 } else { maxX = m; minX = vw - sw - m }
        if (sh <= vh) { minY = maxY = (vh - sh) / 2 } else { maxY = m; minY = vh - sh - m }
        this.bounds = { minX, maxX, minY, maxY };
        this.drag = Draggable.create(this.canvas, {
          type: "x,y", bounds: { minX, maxX, minY, maxY }, edgeResistance: .85, dragResistance: .06,
          force3D: true,
          onDragStart: () => {
            document.body.classList.add('bwg-dragging');
            this.canvas.style.willChange = 'transform';
            this._isElasticSettled = false;
          },
          onDragEnd: () => {
            document.body.classList.remove('bwg-dragging');
            this.canvas.style.willChange = 'auto';
          }
        })[0];
      }

      // ---- ElasticGridScroll-inspired stretch (github.com/codrops/ElasticGridScroll) ----
      initElastic() {
        if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
        const mid = (this.cfg.cols - 1) / 2;
        this.items.forEach(it => {
          it.si = 1; it.sy = 1;
          it.lag = 0.1 + Math.abs(it.c - mid) * 0.035; // columns farther from center feel lazier
        });
        this._elX = gsap.getProperty(this.canvas, "x"); this._elY = gsap.getProperty(this.canvas, "y");
        this._elT = null;
        if (this._elTick) gsap.ticker.remove(this._elTick);
        gsap.ticker.add(this._elTick = () => this.tickElastic());
      }
      tickElastic() {
        if (this.zoomOn) return;
        const now = performance.now();
        const x = gsap.getProperty(this.canvas, "x"), y = gsap.getProperty(this.canvas, "y");
        if (this._elT === null) { this._elX = x; this._elY = y; this._elT = now; return; }
        const dt = Math.max((now - this._elT) / 1000, 1 / 120);
        const vx = (x - this._elX) / dt, vy = (y - this._elY) / dt;
        this._elX = x; this._elY = y; this._elT = now;

        const avx = Math.abs(vx), avy = Math.abs(vy);
        if (avx < 0.5 && avy < 0.5 && this._isElasticSettled) {
          return;
        }

        const threshold = 60, sensitivity = 900, maxStretch = 1.22, minSqueeze = .84;
        let targetSi = 1, targetSy = 1, origin = '50% 50%';
        if (avy >= avx) {
          const n = Math.min(Math.max(0, avy - threshold) / sensitivity, 1);
          targetSy = 1 + (maxStretch - 1) * n; targetSi = 1 + (minSqueeze - 1) * n;
          origin = vy < 0 ? '50% 0%' : '50% 100%';
        } else {
          const n = Math.min(Math.max(0, avx - threshold) / sensitivity, 1);
          targetSi = 1 + (maxStretch - 1) * n; targetSy = 1 + (minSqueeze - 1) * n;
          origin = vx < 0 ? '0% 50%' : '100% 50%';
        }

        let allSettled = (targetSi === 1 && targetSy === 1);
        this.items.forEach(it => {
          const speed = Math.min(1, dt / it.lag);
          it.si += (targetSi - it.si) * speed;
          it.sy += (targetSy - it.sy) * speed;
          if (Math.abs(it.si - 1) > 0.002 || Math.abs(it.sy - 1) > 0.002) {
            allSettled = false;
            it.el.style.transformOrigin = origin;
            it.el.style.transform = `scale(${it.si.toFixed(4)}, ${it.sy.toFixed(4)})`;
          } else if (it.si !== 1 || it.sy !== 1) {
            it.si = 1; it.sy = 1;
            it.el.style.transform = '';
          }
        });
        this._isElasticSettled = allSettled;
      }

      intro() {
        const z = this.cfg.zoom; gsap.set(this.canvas, { scale: z });
        const c = this.center(z); gsap.set(this.canvas, { x: c.x, y: c.y });
        const vw = this.vp.clientWidth, vh = this.vp.clientHeight;
        const cx = (vw / 2 - c.x) / z - this.cfg.width / 2, cy = (vh / 2 - c.y) / z - this.cfg.height / 2;
        this.items.forEach((it, i) => gsap.set(it.el, { left: cx, top: cy, scale: .8, opacity: 0, zIndex: this.items.length - i }));
        gsap.to(this.vp, { opacity: 1, duration: .4 });
        gsap.to(this.items.map(i => i.el), {
          duration: .45, left: i => this.items[i].x, top: i => this.items[i].y, scale: 1, opacity: 1, ease: "power2.out",
          stagger: { amount: 1.1, grid: [this.cfg.rows, this.cfg.cols], from: "center" },
          onComplete: () => {
            this.items.forEach(it => gsap.set(it.el, { zIndex: 1 })); this.initDrag(); this.observe(); this.initElastic();
          }
        });
      }
      observe() {
        this.io = new IntersectionObserver((es) => es.forEach(e => {
          if (this.sel && e.target === this.sel.el) return;
          e.target.classList.toggle('dim', !e.isIntersecting);
        }), { threshold: .1, rootMargin: '8%' });
        this.items.forEach(it => this.io.observe(it.el));
      }
      preloadAdjacent(i) {
        const total = this.items.length;
        const nextIdx = (i + 1) % total;
        const prevIdx = (i - 1 + total) % total;
        [nextIdx, prevIdx].forEach(idx => {
          if (IMAGES[idx]) {
            const img = new Image();
            img.decoding = 'async';
            img.src = IMAGES[idx];
          }
        });
      }
      enter(data) {
        if (this.zoomOn) return;
        this.zoomOn = true; this.sel = data; document.body.classList.add('bwg-zoom'); if (this.drag) this.drag.disable();
        
        const r = data.img.getBoundingClientRect();
        const isMobile = window.innerWidth < 768;
        const maxW = isMobile ? window.innerWidth * 0.92 : window.innerWidth * 0.62;
        const maxH = isMobile ? window.innerHeight * 0.52 : window.innerHeight * 0.76;
        let W = maxW;
        let H = W * (this.cfg.height / this.cfg.width);
        if (H > maxH) {
          H = maxH;
          W = H * (this.cfg.width / this.cfg.height);
        }
        const targetLeft = (window.innerWidth - W) / 2;
        const targetTop = isMobile ? window.innerHeight * 0.10 : (window.innerHeight - H) / 2;
        this._targetBounds = { W, H, targetLeft, targetTop };

        const ov = document.createElement('div');
        ov.className = 'scaler';
        ov.style.width = W + 'px';
        ov.style.height = H + 'px';
        ov.style.left = targetLeft + 'px';
        ov.style.top = targetTop + 'px';

        const im = document.createElement('img');
        im.decoding = 'async';
        im.src = data.img.currentSrc || data.img.src;
        ov.appendChild(im);
        document.body.appendChild(ov);
        this.overlay = ov;

        // Upgrade seamlessly to HQ full resolution
        const hqUrl = IMAGES[data.index];
        const hqImg = new Image();
        hqImg.decoding = 'async';
        hqImg.src = hqUrl;
        hqImg.onload = () => {
          if (this.overlay === ov) {
            im.src = hqUrl;
          }
        };

        const scaleX = r.width / W;
        const scaleY = r.height / H;
        const dx = r.left - targetLeft;
        const dy = r.top - targetTop;

        gsap.set(ov, {
          x: dx,
          y: dy,
          scaleX: scaleX,
          scaleY: scaleY,
          transformOrigin: '0 0',
          opacity: 1,
          force3D: true
        });
        gsap.set(data.img, { opacity: 0 });

        this.split.classList.add('active');
        gsap.to(this.split, { opacity: 1, duration: .45, ease: "power2.out" });

        gsap.to(ov, {
          x: 0,
          y: 0,
          scaleX: 1,
          scaleY: 1,
          duration: .6,
          ease: "power3.out",
          force3D: true,
          onComplete: () => {
            this.showDetail(data.index);
            this.preloadAdjacent(data.index);
          }
        });

        this.close.classList.add('active');
        gsap.fromTo(this.close, { x: 40, opacity: 0 }, { x: 0, opacity: 1, duration: .45, delay: .2, ease: "power2.out" });
        this.prevBtn.classList.add('active'); this.nextBtn.classList.add('active');
        gsap.to([this.prevBtn, this.nextBtn], { opacity: 1, duration: .35, delay: .2 });

        document.getElementById('splitL').addEventListener('click', this._areaClick = (e) => { if (e.target === e.currentTarget) this.exit(); });
        document.getElementById('splitR').addEventListener('click', this._areaClick);
        document.addEventListener('keydown', this._key = (e) => {
          if (e.key === 'Escape') this.exit();
          else if (e.key === 'ArrowLeft') this.navigate(-1);
          else if (e.key === 'ArrowRight') this.navigate(1);
        });

        // Mouse Wheel & Trackpad Navigation Listener
        let lastWheelTime = 0;
        window.addEventListener('wheel', this._wheel = (e) => {
          if (!this.zoomOn) return;
          e.preventDefault();
          const now = Date.now();
          if (now - lastWheelTime < 220) return;
          if (Math.abs(e.deltaY) > 10 || Math.abs(e.deltaX) > 10) {
            lastWheelTime = now;
            const dir = (e.deltaY > 0 || e.deltaX > 0) ? 1 : -1;
            this.navigate(dir);
          }
        }, { passive: false });

        // Touch Swipe Gestures for Mobile
        let touchStartX = 0, touchStartY = 0;
        window.addEventListener('touchstart', this._touchStart = (e) => {
          if (!this.zoomOn || e.touches.length > 1) return;
          touchStartX = e.touches[0].clientX;
          touchStartY = e.touches[0].clientY;
        }, { passive: true });

        window.addEventListener('touchend', this._touchEnd = (e) => {
          if (!this.zoomOn || e.changedTouches.length === 0) return;
          const tdx = e.changedTouches[0].clientX - touchStartX;
          const tdy = e.changedTouches[0].clientY - touchStartY;
          if (Math.abs(tdx) > 36 && Math.abs(tdx) > Math.abs(tdy)) {
            this.navigate(tdx < 0 ? 1 : -1);
          }
        }, { passive: true });
      }
      navigate(dir) {
        if (!this.zoomOn || !this.overlay || this.isNavigating) return;
        this.isNavigating = true;
        const total = this.items.length;
        gsap.set(this.sel.img, { opacity: 1 });                       // restore the cell we're leaving
        this.sel = this.items[(this.sel.index + dir + total) % total];
        gsap.set(this.sel.img, { opacity: 0 });                       // hide the new cell (overlay stands in)
        
        const im = this.overlay.querySelector('img');
        const slideOutX = dir > 0 ? -40 : 40;
        const slideInX = dir > 0 ? 40 : -40;

        gsap.to(this.overlay, {
          x: slideOutX, opacity: 0, duration: 0.16, ease: "power2.in", onComplete: () => {
            const thumbUrl = IMAGES[this.sel.index].replace('.webp', '_thumb.webp');
            const hqUrl = IMAGES[this.sel.index];
            im.src = thumbUrl;

            const hqImg = new Image();
            hqImg.decoding = 'async';
            hqImg.src = hqUrl;
            hqImg.onload = () => {
              if (this.overlay && this.sel.index === this.items.indexOf(this.sel)) {
                im.src = hqUrl;
              }

            this.preloadAdjacent(this.sel.index);
            gsap.set(this.overlay, { x: slideInX });
            gsap.to(this.overlay, {
              x: 0, opacity: 1, duration: 0.26, ease: "power2.out", onComplete: () => {

              }
            });

          }
        });
      }
      showDetail(i) {
        const m = META[i % META.length];
        document.getElementById('dN').textContent = m.n; document.getElementById('dT').textContent = m.t; document.getElementById('dD').textContent = m.d;
        gsap.set('#dN', { y: 15, opacity: 0 }); gsap.set('#dT', { y: 40, opacity: 0 }); gsap.set('#dD', { y: 50, opacity: 0 });
        this.detail.style.pointerEvents = 'none'; gsap.to(this.detail, { opacity: 1, duration: .25 });
        gsap.to('#dN', { y: 0, opacity: 1, duration: .5, delay: .05, ease: "power2.out" });
        gsap.to('#dT', { y: 0, opacity: 1, duration: .5, delay: .1, ease: "power2.out" });
        gsap.to('#dD', { y: 0, opacity: 1, duration: .5, delay: .15, ease: "power2.out" });
      }
      exit() {
        if (!this.zoomOn || !this.sel || !this.overlay) return;
        const ov = this.overlay, img = this.sel.img;
        document.removeEventListener('keydown', this._key);
        if (this._wheel) window.removeEventListener('wheel', this._wheel);
        if (this._touchStart) window.removeEventListener('touchstart', this._touchStart);
        if (this._touchEnd) window.removeEventListener('touchend', this._touchEnd);
        document.getElementById('splitL').removeEventListener('click', this._areaClick);
        document.getElementById('splitR').removeEventListener('click', this._areaClick);

        gsap.to(this.detail, { opacity: 0, duration: .2 });
        gsap.to(['#dN', '#dT', '#dD'], { y: -20, opacity: 0, duration: .2, ease: "power2.in" });
        gsap.to(this.close, { opacity: 0, x: 40, duration: .2 });
        gsap.to([this.prevBtn, this.nextBtn], { opacity: 0, duration: .2 });
        this.prevBtn.classList.remove('active'); this.nextBtn.classList.remove('active');
        this.split.classList.remove('active'); gsap.to(this.split, { opacity: 0, duration: .4, ease: "power2.out" });

        const r = img.getBoundingClientRect();
        const { W, H, targetLeft, targetTop } = this._targetBounds || {
          W: parseFloat(ov.style.width),
          H: parseFloat(ov.style.height),
          targetLeft: parseFloat(ov.style.left),
          targetTop: parseFloat(ov.style.top)
        };

        const scaleX = r.width / W;
        const scaleY = r.height / H;
        const dx = r.left - targetLeft;
        const dy = r.top - targetTop;

        gsap.to(ov, {
          x: dx,
          y: dy,
          scaleX: scaleX,
          scaleY: scaleY,
          duration: .5,
          ease: "power3.inOut",
          force3D: true,
          onComplete: () => {
            gsap.set(img, { opacity: 1 }); ov.remove();
            document.body.classList.remove('bwg-zoom'); this.close.classList.remove('active');
            if (this.drag) this.drag.enable(); this.zoomOn = false; this.isNavigating = false; this.sel = null; this.overlay = null;
          }
        });
      }
    }

    let gallery;
    function boot() {
      if (window._booted) return;
      window._booted = true;
      gallery = new Gallery();
      gallery.intro();
      addEventListener('resize', () => { clearTimeout(gallery._rz); gallery._rz = setTimeout(() => gallery.initDrag(), 120); });
    }
    if (document.readyState === 'interactive' || document.readyState === 'complete') {
      boot();
    } else {
      document.addEventListener('DOMContentLoaded', boot);
      addEventListener('load', boot);
    }
  </script>
